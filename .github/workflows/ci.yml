name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Static Site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate HTML and JS assets
        run: node scripts/validate-static.cjs

      - name: QA onboarding (hub → mapa VOC)
        run: node scripts/qa-onboarding.cjs

      - name: Run unit tests
        run: node tests/unit.cjs

  a11y-gt:
    name: Smoke + axe AA /campo/gt/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Instalar Playwright y axe (sin tocar package.json)
        run: |
          npm install --no-save --no-package-lock playwright@1 @axe-core/playwright@4
          npx playwright install --with-deps chromium
      - name: Servir public/ y correr smoke
        run: |
          python3 -m http.server 8080 --directory public >/dev/null 2>&1 &
          sleep 2
          BASE=http://localhost:8080 node scripts/smoke-gt.mjs
