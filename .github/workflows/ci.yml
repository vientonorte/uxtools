name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Static Site
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate HTML and JS assets
        run: node scripts/validate-static.cjs

      - name: QA onboarding (hub → mapa VOC)
        run: node scripts/qa-onboarding.cjs

      - name: Run unit tests
        run: node tests/unit.cjs

      - name: Install dependencies
        run: npm install

      - name: Build static suite + React app
        run: npm run build:pages

      - name: PII fixture must fail
        run: npm run qa:no-pii:fixture

      - name: Shipped bundle has no denied tokens
        run: npm run qa:no-pii
